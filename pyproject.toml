[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "research-web-pipeline"
version = "0.4.0"
description = "Воспроизводимый сбор веб-данных через четыре сменных загрузчика"
requires-python = ">=3.11"
dependencies = [
  "curl_cffi==0.16.3",
  "beautifulsoup4==4.15.0",
  "openpyxl==3.1.5",
]

[project.optional-dependencies]
browsers = [
  "patchright==1.64.1", "camoufox==0.5.8", "clearcote==0.51.1",
  "fpgen==1.3.0", "indexed-zstd==1.7.2",
]
dev = ["pytest==9.1.1"]
analysis = ["fintech-triage @ git+https://github.com/GANRA3EV/fintech-triage.git@3b75fb49c213536519a6a36a24828f63f219b3a6"]
local-hf = ["fintech-triage[local-hf] @ git+https://github.com/GANRA3EV/fintech-triage.git@3b75fb49c213536519a6a36a24828f63f219b3a6"]
embeddings = ["sentence-transformers>=3,<6"]

[tool.setuptools.packages.find]
include = ["web_pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["browser: запуск установленного браузера"]
