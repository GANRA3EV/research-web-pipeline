name: Проверки
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      browsers:
        description: Проверить три браузера с загрузкой дистрибутивов
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q -m 'not browser'
  browsers:
    if: github.event_name == 'workflow_dispatch' && inputs.browsers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[browsers,dev]'
      - run: python -m patchright install --with-deps chromium
      - run: python -m playwright install-deps firefox
      - run: python -m camoufox fetch
      - run: python -m pytest -q -m browser
        env:
          TEST_BROWSERS: '1'
  analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev,analysis]'
      - run: python -m pytest -q -m 'not browser'
